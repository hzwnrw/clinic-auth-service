spring.application.name=Clinic Auth Service
server.port=1202
app.env=DEV  # Change to PROD in production

# MySQL Configuration
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/auth_db?useSSL=false&serverTimezone=Asia/Kuala_Lumpur&allowPublicKeyRetrieval=true
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis Configuration
spring.redis.host=127.0.0.1
spring.redis.port=6379
spring.redis.password=password
spring.redis.timeout=6000

jwt.expiration=86400000
app.encryption.secret=${APP_ENCRYPTION_SECRET}
app.encryption.salt=${APP_ENCRYPTION_SALT}

logging.level.org.springframework.data.redis=DEBUG
logging.level.io.lettuce.core=DEBUG